<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de CEP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Consulta de CEP</h1>

    <form id="form-cep">
      <input type="text" id="cep" placeholder="Digite o CEP (ex: 63500000)" maxlength="9" required>
      <button type="submit">Buscar</button>
    </form>

    <p id="mensagem"></p>

    <div id="resultado" hidden>
      <p><strong>CEP:</strong> <span id="r-cep"></span></p>
      <p><strong>Rua:</strong> <span id="r-rua"></span></p>
      <p><strong>Bairro:</strong> <span id="r-bairro"></span></p>
      <p><strong>Cidade:</strong> <span id="r-cidade"></span></p>
      <p><strong>Estado:</strong> <span id="r-estado"></span></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
